<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>감정탐지기</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #000;
            font-family: 'Pretendard', sans-serif;
            color: #fff;
        }
        
        #videoElement {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2;
            transform: scaleX(-1);
        }

        #controls {
            position: absolute; bottom: 40px; left: 40px; z-index: 10;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #fff; padding: 30px;
            width: 280px; backdrop-filter: blur(10px);
            border-radius: 16px; 
        }
        
        .control-group { margin-bottom: 25px; }
        label { display: block; font-size: 0.75rem; margin-bottom: 8px; color: #ccc; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #fff; }
        
        #scanBtn {
            width: 100%; padding: 15px; background: #fff; color: #000; border: none;
            font-size: 1rem; cursor: pointer; font-family: inherit; font-weight: bold;
            border-radius: 8px; transition: all 0.2s; margin-bottom: 25px;
        }
        #scanBtn:hover { background: #e0e0e0; }
        
        #emotionCircle {
            position: absolute; 
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 160px; height: 160px; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center; text-align: center;
            z-index: 10;
            backdrop-filter: blur(8px); 
            border: none; 
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4); 
            transition: background 0.4s ease;
            opacity: 0;
            will-change: left, top;
        }
        
        h1#titletext {
            margin: 0; 
            font-size: 20px; 
            font-weight: 400; 
            line-height: 1.2; word-break: keep-all;
            color: #fff;
            text-shadow: none; 
            transition: color 0.4s ease;
        }

        #helpBtn {
            position: absolute; top: 30px; right: 30px; z-index: 20;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1.5px solid #fff; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; color: #fff;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }
        #helpBtn:hover { background: #fff; color: #000; }

        #helpModal {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: rgba(10, 10, 10, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; padding: 30px 40px; width: 320px;
            color: #fff; font-size: 0.85rem; line-height: 1.8;
            backdrop-filter: blur(15px);
        }
        .modal-content p { margin: 5px 0; }
        .modal-close {
            display: block; text-align: center; margin-top: 25px; cursor: pointer;
            text-decoration: underline; color: #aaa; font-size: 0.85rem;
        }
        .modal-close:hover { color: #fff; }
    </style>
</head>
<body>

    <video autoplay muted playsinline id="videoElement"></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="helpBtn">?</div>

    <div id="helpModal">
        <div class="modal-content">
            <p><strong>Scan Emotion:</strong>지금의 감정을 진단하세요.</p>
            <p><strong>Red:</strong> 열정과 분노의 수치를 조절하세요.</p>
            <p><strong>Green:</strong> 평온과 안정의 수치를 조절하세요.</p>
            <p><strong>Blue:</strong> 차분함과 우울함의 수치를 조절하세요.</p>
            <p>* 카메라가 켜지면 감정 원형이 얼굴을 따라다닙니다.</p>
            <span class="modal-close" id="closeBtn">닫기</span>
        </div>
    </div>

    <div id="controls">
        <button id="scanBtn">Scan Emotion</button>
        <div class="control-group">
            <label>Red (열정 / 분노)</label>
            <input type="range" id="red1" min="0" max="255" value="255">
        </div>
        <div class="control-group">
            <label>Green (평온 / 안정)</label>
            <input type="range" id="green1" min="0" max="255" value="255">
        </div>
        <div class="control-group">
            <label>Blue (차분 / 우울)</label>
            <input type="range" id="blue1" min="0" max="255" value="255">
        </div>
    </div>

    <div id="emotionCircle">
        <h1 id="titletext">얼굴<br>탐색중</h1>
    </div>

    <script>
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");
        
        const titletext = document.getElementById("titletext");
        const emotionCircle = document.getElementById("emotionCircle");
        const red1 = document.getElementById("red1");
        const green1 = document.getElementById("green1");
        const blue1 = document.getElementById("blue1");
        const scanBtn = document.getElementById("scanBtn");
        
        const helpBtn = document.getElementById("helpBtn");
        const helpModal = document.getElementById("helpModal");
        const closeBtn = document.getElementById("closeBtn");

        let currentFaceRect = null; 
        let hasInteracted = false; 

        helpBtn.onclick = function() { helpModal.style.display = "flex"; }
        closeBtn.onclick = function() { helpModal.style.display = "none"; }
        window.onclick = function(event) {
            if (event.target == helpModal) { helpModal.style.display = "none"; }
        }

        function playDingSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const actx = new AudioContext();
            const playNote = (freq, startTime, duration) => {
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(actx.destination);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            playNote(659.25, actx.currentTime, 0.2); 
            playNote(880.00, actx.currentTime + 0.1, 0.3);
        }

        function updateGraphic() {
            const r = parseInt(red1.value);
            const g = parseInt(green1.value);
            const b = parseInt(blue1.value);
            
            emotionCircle.style.background = `rgba(${r}, ${g}, ${b}, 0.65)`;

            if (!hasInteracted) {
                titletext.innerHTML = "얼굴<br>탐색중";
                titletext.style.color = "#ffffff";
                titletext.style.fontSize = "20px";
                return; 
            }

            let emotionStr = "";
            const mid = 127; 
            if (r > g + 10 && r > b + 10) emotionStr = r > mid ? "분노" : "열정";
            else if (b > r + 5 && b > g + 5) emotionStr = b > mid ? "우울" : "차분";
            else if (g > r && g > b) emotionStr = g > mid ? "평온" : "안정";
            else {
                let brightness = (r + g + b) / 3;
                emotionStr = brightness > mid ? "명랑" : "행복";
            }
            
            titletext.innerHTML = emotionStr;
            titletext.style.fontSize = "26px"; 

            let fontColor = "#ffffff";
            let maxVal = Math.max(r, g, b);
            let minVal = Math.min(r, g, b);
            
            if (maxVal - minVal > 30) { 
                if (maxVal === r && r > g + 20 && r > b + 20) fontColor = "#ff1111"; 
                else if (maxVal === b && b > r + 20 && b > g + 20) fontColor = "#1155ff"; 
                else if (maxVal === g && g > r + 20 && g > b + 20) fontColor = "#00dd22"; 
                else if (r > 150 && g > 150 && b < 100) fontColor = "#ff9900"; 
            } else if (r > 200 && g > 200 && b > 200) {
                fontColor = "#ffffff"; 
            }
            titletext.style.color = fontColor;
        }

        red1.oninput = function() { hasInteracted = true; updateGraphic(); };
        green1.oninput = function() { hasInteracted = true; updateGraphic(); };
        blue1.oninput = function() { hasInteracted = true; updateGraphic(); };
        updateGraphic();

        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;
        let currentX = window.innerWidth / 2;
        let currentY = window.innerHeight / 2;

        function animateCircle() {
            currentX += (targetX - currentX) * 0.15;
            currentY += (targetY - currentY) * 0.15;
            
            emotionCircle.style.left = currentX + "px";
            emotionCircle.style.top = currentY + "px";
            
            requestAnimationFrame(animateCircle);
        }
        animateCircle();

        navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
        }).then(function (stream) {
            video.srcObject = stream;

                video.onloadedmetadata = function() {
                video.width = video.videoWidth;
                video.height = video.videoHeight;
                video.play();
                emotionCircle.style.opacity = 1; 
            };
        }).catch(function (err) {
            console.error("웹캠을 허용해주세요.", err);
            hasInteracted = true;
            titletext.innerHTML = "카메라<br>필요";
            emotionCircle.style.opacity = 1;
        });

        scanBtn.onclick = function() {
            hasInteracted = true;
            scanBtn.innerText = "ANALYZING...";
            playDingSound(); 
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let scanX = canvas.width / 2;
            let scanY = canvas.height / 2;
            
            if (currentFaceRect && !isNaN(currentFaceRect.x)) {
                scanX = canvas.width - (currentFaceRect.x + currentFaceRect.width/2);
                scanY = currentFaceRect.y + currentFaceRect.height/2;
            }
            
            const safeScanX = Math.max(0, Math.min(scanX - 25, canvas.width - 50));
            const safeScanY = Math.max(0, Math.min(scanY - 25, canvas.height - 50));
            
            const imgData = ctx.getImageData(safeScanX, safeScanY, 50, 50);
            const data = imgData.data;
            let r = 0, g = 0, b = 0;
            
            for(let i = 0; i < data.length; i += 4) {
                r += data[i]; g += data[i+1]; b += data[i+2];
            }
            
            const pixelCount = data.length / 4;
            let avgR = Math.floor(r / pixelCount);
            let avgG = Math.floor(g / pixelCount);
            let avgB = Math.floor(b / pixelCount);

            if (avgR > avgG + 10 && avgR > avgB + 10) {
                avgR = Math.min(avgR + 120, 255); avgG = Math.max(avgG - 30, 0); avgB = Math.max(avgB - 30, 0);
            } else if (avgB > avgR + 5 && avgB > avgG + 5) {
                avgB = Math.min(avgB + 150, 255); avgR = Math.max(avgR - 50, 0); avgG = Math.max(avgG - 30, 0);
            } else if (avgG > avgR && avgG > avgB) {
                avgG = Math.min(avgG + 120, 255); avgR = Math.max(avgR - 20, 0); avgB = Math.max(avgB - 20, 0);
            } else {
                avgR = Math.min(avgR + 100, 255); avgG = Math.min(avgG + 80, 255); avgB = Math.max(avgB - 50, 0);
            }

            red1.value = avgR; 
            green1.value = avgG; 
            blue1.value = avgB;
            
            updateGraphic();
            
            setTimeout(() => { scanBtn.innerText = "Scan Emotion"; }, 500);
        }
    </script>
    <script type="module">
    import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    async function startTracking() {
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        const detector = await FaceDetector.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
            },
            runningMode: "VIDEO",
            minDetectionConfidence: 0.5
        });

        setInterval(function() {
            if (video.readyState < 2 || !video.videoWidth) return;

            const result = detector.detectForVideo(video, performance.now());
            if (result.detections.length === 0) return;

            result.detections.sort((a, b) => (b.boundingBox.width * b.boundingBox.height) - (a.boundingBox.width * a.boundingBox.height));
            const box = result.detections[0].boundingBox;
            currentFaceRect = { x: box.originX, y: box.originY, width: box.width, height: box.height };

            const scale = Math.max(window.innerWidth / video.videoWidth, window.innerHeight / video.videoHeight);
            const xOffset = (window.innerWidth - video.videoWidth * scale) / 2;
            const yOffset = (window.innerHeight - video.videoHeight * scale) / 2;

            const mirroredX = video.videoWidth - (box.originX + box.width);
            const mappedX = mirroredX * scale + xOffset;
            const mappedY = box.originY * scale + yOffset;

            let safeX = mappedX + box.width * scale + 20;
            let safeY = mappedY + (box.height * scale) / 2;

            safeX = Math.max(80, Math.min(window.innerWidth - 80, safeX));
            safeY = Math.max(80, Math.min(window.innerHeight - 80, safeY));

            if (Math.abs(safeX - targetX) > 12 || Math.abs(safeY - targetY) > 12) {
                targetX = safeX;
                targetY = safeY;
            }
        }, 120);
    }

    startTracking();
</script>
</body>
</html>
